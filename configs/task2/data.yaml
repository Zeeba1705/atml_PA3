smoke:
  caption_train_images: 20
  caption_dev_images: 4
  vqa_pairs:
    train: {yes/no: 4, number: 2, other: 4}
    dev: {yes/no: 1, number: 1, other: 1}
    test: {yes/no: 2, number: 1, other: 2}
