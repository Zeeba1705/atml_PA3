#task 2 data selection (handout pp. 7-8), seed from base.yaml. annotation files only; images are fetched later
#for the selected ids (features.py)
annotation_urls:
  coco: http://images.cocodataset.org/annotations/annotations_trainval2014.zip
  vqa_questions_train: https://s3.amazonaws.com/cvmlp/vqa/mscoco/vqa/v2_Questions_Train_mscoco.zip
  vqa_questions_val: https://s3.amazonaws.com/cvmlp/vqa/mscoco/vqa/v2_Questions_Val_mscoco.zip
  vqa_annotations_train: https://s3.amazonaws.com/cvmlp/vqa/mscoco/vqa/v2_Annotations_Train_mscoco.zip
  vqa_annotations_val: https://s3.amazonaws.com/cvmlp/vqa/mscoco/vqa/v2_Annotations_Val_mscoco.zip
  vqa_pairs_train: https://s3.amazonaws.com/cvmlp/vqa/mscoco/vqa/v2_Complementary_Pairs_Train_mscoco.zip
  vqa_pairs_val: https://s3.amazonaws.com/cvmlp/vqa/mscoco/vqa/v2_Complementary_Pairs_Val_mscoco.zip
image_url: http://images.cocodataset.org/{split}/COCO_{split}_{image_id:012d}.jpg

#sizes (handout p. 7-8)
caption_train_images: 6000
captions_per_train_image: 3
caption_dev_images: 96
vqa_pairs:
  train: {yes/no: 640, number: 256, other: 640}
  dev: {yes/no: 12, number: 8, other: 12}
  test: {yes/no: 36, number: 24, other: 36}
vqa_min_agreement: 8
#grounding eval pairs: the handout gives presence + counting together; split evenly
grounding_pairs:
  dev: {presence: 12, counting: 12}
  test: {presence: 32, counting: 32}
count_range: [1, 4]
#training pools (sampled with replacement during training), built from the caption training images
grounding_pool_pairs: {presence: 8000, counting: 8000}

#wording (strict rule): presence phrase = a/an + name unless listed; plural map for counting questions
presence_phrase_overrides: {skis: skis, scissors: scissors, broccoli: broccoli}
