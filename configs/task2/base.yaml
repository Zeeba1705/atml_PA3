#task 2 siglip-qwen vlm (handout pp. 6-10). fixed values only; scripts read everything from here
seed: 6304
vision_model: google/siglip-base-patch16-224
llm_name: Qwen/Qwen3-0.6B
enable_thinking: false
n_patches: 196
vision_dim: 768
llm_dim: 1024

#connector: Linear 768->1024, GELU, Linear 1024->1024, fp32, trainable throughout
connector_hidden: 1024

#prompt layout: visual tokens first in the user message, then a newline, then the question
caption_prompt: Describe this image in one sentence.
image_marker: "@@IMAGE@@"

#content-token caps (handout p. 8)
max_question_tokens: 80
max_caption_tokens: 64
max_answer_tokens: 16

#training (handout p. 8)
micro_batch: 8
grad_accum: 2
weight_decay: 0.01
betas: [0.9, 0.999]
eps: 1.0e-8
max_grad_norm: 1.0
warmup_frac: 0.05
min_lr_frac: 0.1
grad_checkpointing: true
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_targets: [q_proj, k_proj, v_proj, o_proj]
stages:
  - {name: stage1, updates: 2250, connector_lr: 1.0e-3, lora_lr: null, mixture: {caption: 1.0}}
  - {name: stage2, updates: 1500, connector_lr: 1.0e-4, lora_lr: 2.0e-5, mixture: {presence: 0.5, counting: 0.25, caption: 0.25}}
  - {name: stage3, updates: 750, connector_lr: 5.0e-5, lora_lr: 1.0e-5, mixture: {vqa: 0.7, presence: 0.1, counting: 0.1, caption: 0.1}}
#each draw = one full question pair or two caption examples
examples_per_draw: 2
ckpt_every: 250
dev_eval_every: 500

#final evaluation (handout p. 8-9)
eval_max_new_tokens: 16
eval_batch_size: 8
bootstrap_resamples: 4000

#--smoke: tiny random qwen (real tokenizer), few updates per stage, cpu fp32
smoke:
  micro_batch: 2
  grad_accum: 2
  stages:
    - {name: stage1, updates: 4, connector_lr: 1.0e-3, lora_lr: null, mixture: {caption: 1.0}}
    - {name: stage2, updates: 4, connector_lr: 1.0e-4, lora_lr: 2.0e-5, mixture: {presence: 0.5, counting: 0.25, caption: 0.25}}
    - {name: stage3, updates: 4, connector_lr: 5.0e-5, lora_lr: 1.0e-5, mixture: {vqa: 0.7, presence: 0.1, counting: 0.1, caption: 0.1}}
  ckpt_every: 3
  dev_eval_every: 6
  eval_batch_size: 4
  grad_checkpointing: false
  smoke_llm: {hidden_size: 64, intermediate_size: 64, num_hidden_layers: 2, num_attention_heads: 4, num_key_value_heads: 2, head_dim: 16}
